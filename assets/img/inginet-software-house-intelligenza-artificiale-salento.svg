<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Inginet: sviluppo software con intelligenza artificiale</title><desc id="dsc">Illustrazione di una piattaforma software: pannello di controllo centrale, rete neurale collegata, moduli di intelligenza artificiale, codice e indicizzazione.</desc>

<defs>
  <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb43d"/><stop offset=".5" stop-color="#ff9c00"/><stop offset="1" stop-color="#2d7dff"/>
  </linearGradient>
  <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#0c1424"/>
  </linearGradient>
  <linearGradient id="hg3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2d7dff"/><stop offset="1" stop-color="#6aa5ff"/>
  </linearGradient>
  <radialGradient id="hglow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff9c00" stop-opacity=".55"/><stop offset="1" stop-color="#ff9c00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hglow2" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2d7dff" stop-opacity=".5"/><stop offset="1" stop-color="#2d7dff" stop-opacity="0"/>
  </radialGradient>
  <filter id="hsoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<ellipse cx="300" cy="230" rx="270" ry="230" fill="url(#hglow)"/>
<ellipse cx="640" cy="520" rx="250" ry="220" fill="url(#hglow2)"/>

<!-- rete di nodi sullo sfondo -->
<g stroke="url(#hg1)" stroke-width="1.2" opacity=".45" fill="none">
  <path d="M120 120 L300 190 L470 110 L690 180"/>
  <path d="M120 120 L180 320 L300 190"/>
  <path d="M690 180 L760 350 L620 430"/>
  <path d="M180 320 L360 400 L620 430"/>
  <path d="M360 400 L300 620 L560 660 L620 430"/>
</g>
<g fill="url(#hg1)">
  <circle cx="120" cy="120" r="5"/><circle cx="300" cy="190" r="5"/><circle cx="470" cy="110" r="5"/><circle cx="690" cy="180" r="5"/><circle cx="180" cy="320" r="5"/><circle cx="760" cy="350" r="5"/><circle cx="360" cy="400" r="5"/><circle cx="620" cy="430" r="5"/><circle cx="300" cy="620" r="5"/><circle cx="560" cy="660" r="5"/>
</g>

<!-- pannello principale -->

<rect x="150" y="210" width="520" height="340" rx="22" fill="url(#hg2)" stroke="#243352" stroke-width="1.5"/>
<path d="M150 244h520" stroke="#243352" stroke-width="1.5"/>
<circle cx="168" cy="227" r="4" fill="#ff5f57"/><circle cx="183" cy="227" r="4" fill="#ffbd2e"/><circle cx="198" cy="227" r="4" fill="#28c840"/>
<rect x="180" y="266" width="160" height="12" rx="6" fill="#2b3b5e"/>
<rect x="180" y="292" width="104" height="12" rx="6" fill="#22304d"/>
<!-- barre -->
<g>
  <rect x="182" y="470" width="34" height="42" rx="8" fill="#22304d"/>
  <rect x="228" y="440" width="34" height="72" rx="8" fill="#2b3b5e"/>
  <rect x="274" y="404" width="34" height="108" rx="8" fill="url(#hg3)"/>
  <rect x="320" y="368" width="34" height="144" rx="8" fill="url(#hg1)"/>
</g>
<!-- curva -->
<path d="M390 480 C430 470 440 400 480 392 C520 384 540 430 580 412 C610 398 620 350 645 340"
      fill="none" stroke="url(#hg1)" stroke-width="4" stroke-linecap="round"/>
<circle cx="645" cy="340" r="7" fill="#ffb43d"/>
<circle cx="645" cy="340" r="14" fill="none" stroke="#ffb43d" stroke-opacity=".4" stroke-width="2"/>

<!-- scheda AI -->
<g>
  <rect x="520" y="120" width="260" height="150" rx="20" fill="#101a2e" stroke="#2b3b5e" stroke-width="1.5"/>
  <circle cx="560" cy="165" r="18" fill="none" stroke="url(#hg1)" stroke-width="3"/>
  <path d="M560 152v-9M560 187v-9M543 165h-9M586 165h-9" stroke="url(#hg1)" stroke-width="3" stroke-linecap="round"/>
  <rect x="592" y="152" width="150" height="11" rx="5.5" fill="#2b3b5e"/>
  <rect x="592" y="172" width="106" height="11" rx="5.5" fill="#22304d"/>
  <rect x="544" y="212" width="198" height="10" rx="5" fill="#22304d"/>
  <rect x="544" y="232" width="148" height="10" rx="5" fill="#22304d"/>
</g>

<!-- scheda codice -->
<g>
  <rect x="60" y="470" width="250" height="180" rx="20" fill="#101a2e" stroke="#2b3b5e" stroke-width="1.5"/>
  <g font-family="monospace" font-size="17" fill="#7b89a5">
    <text x="88" y="516">&lt;<tspan fill="#ffb43d">agent</tspan>&gt;</text>
    <text x="104" y="546" fill="#6aa5ff">read(dati)</text>
    <text x="104" y="576" fill="#6aa5ff">answer()</text>
    <text x="88" y="606">&lt;/<tspan fill="#ffb43d">agent</tspan>&gt;</text>
  </g>
</g>

<!-- badge lingue -->
<g>
  <rect x="600" y="560" width="248" height="120" rx="20" fill="#101a2e" stroke="#2b3b5e" stroke-width="1.5"/>
  <g font-family="'Segoe UI',sans-serif" font-size="21" font-weight="600" fill="#a6b3cc">
    <text x="628" y="606">IT</text><text x="676" y="606">EN</text><text x="724" y="606">DE</text>
    <text x="628" y="646">FR</text><text x="676" y="646">ES</text>
  </g>
  <circle cx="806" cy="600" r="22" fill="none" stroke="url(#hg1)" stroke-width="2.5"/>
  <path d="M784 600h44M806 578a30 30 0 0 1 0 44 30 30 0 0 1 0-44" fill="none" stroke="url(#hg1)" stroke-width="2"/>
</g>
</svg>