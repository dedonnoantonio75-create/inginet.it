<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Indicizzazione sui motori di ricerca e sulle risposte AI</title><desc id="dsc">Schema a due colonne: a sinistra i risultati di un motore di ricerca tradizionale, a destra una risposta generata da un modello di intelligenza artificiale che cita la fonte.</desc>

<defs>
  <linearGradient id="qg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb43d"/><stop offset=".5" stop-color="#ff9c00"/><stop offset="1" stop-color="#2d7dff"/>
  </linearGradient>
  <linearGradient id="qg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#0c1424"/>
  </linearGradient>
  <linearGradient id="qg3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2d7dff"/><stop offset="1" stop-color="#6aa5ff"/>
  </linearGradient>
  <radialGradient id="qglow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff9c00" stop-opacity=".55"/><stop offset="1" stop-color="#ff9c00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="qglow2" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2d7dff" stop-opacity=".5"/><stop offset="1" stop-color="#2d7dff" stop-opacity="0"/>
  </radialGradient>
  <filter id="qsoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<ellipse cx="220" cy="300" rx="250" ry="240" fill="url(#qglow)" opacity=".45"/>
<ellipse cx="620" cy="300" rx="250" ry="240" fill="url(#qglow2)" opacity=".45"/>

<!-- colonna motore di ricerca -->
<g>
  <rect x="40" y="70" width="340" height="480" rx="22" fill="#0d1728" stroke="#243352" stroke-width="1.6"/>
  <rect x="70" y="104" width="280" height="44" rx="22" fill="#101a2e" stroke="#2b3b5e" stroke-width="1.4"/>
  <circle cx="98" cy="126" r="10" fill="none" stroke="url(#qg1)" stroke-width="2.4"/>
  <path d="M106 134l10 10" stroke="url(#qg1)" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="122" y="120" width="150" height="11" rx="5.5" fill="#2b3b5e"/>
  
  <rect x="70" y="190" width="210" height="11" rx="5.5" fill="url(#qg1)"/>
  <rect x="70" y="214" width="280" height="8" rx="4" fill="#22304d"/>
  <rect x="70" y="232" width="232" height="8" rx="4" fill="#1b2740"/>
  <rect x="70" y="288" width="168" height="11" rx="5.5" fill="#2b3b5e"/>
  <rect x="70" y="312" width="280" height="8" rx="4" fill="#22304d"/>
  <rect x="70" y="330" width="232" height="8" rx="4" fill="#1b2740"/>
  <rect x="70" y="386" width="168" height="11" rx="5.5" fill="#2b3b5e"/>
  <rect x="70" y="410" width="280" height="8" rx="4" fill="#22304d"/>
  <rect x="70" y="428" width="232" height="8" rx="4" fill="#1b2740"/>
  <rect x="70" y="470" width="168" height="11" rx="5.5" fill="#2b3b5e"/>
  <rect x="70" y="494" width="280" height="8" rx="4" fill="#22304d"/>
  <rect x="70" y="512" width="232" height="8" rx="4" fill="#1b2740"/>
  <text x="210" y="580" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#a6b3cc">Motori di ricerca</text>
</g>

<!-- colonna risposta AI -->
<g>
  <rect x="440" y="70" width="340" height="480" rx="22" fill="#0d1728" stroke="#243352" stroke-width="1.6"/>
  <g>
    <circle cx="480" cy="118" r="18" fill="none" stroke="url(#qg1)" stroke-width="2.4"/>
    <path d="M480 106v24M468 118h24" stroke="url(#qg1)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="510" y="110" width="130" height="14" rx="7" fill="#2b3b5e"/>
  </g>
  <rect x="470" y="164" width="280" height="212" rx="18" fill="#101a2e" stroke="#2b3b5e" stroke-width="1.4"/>
  <rect x="496" y="196" width="228" height="10" rx="5" fill="#22304d"/><rect x="496" y="224" width="200" height="10" rx="5" fill="#22304d"/><rect x="496" y="252" width="214" height="10" rx="5" fill="#22304d"/><rect x="496" y="280" width="176" height="10" rx="5" fill="#22304d"/><rect x="496" y="308" width="150" height="10" rx="5" fill="#22304d"/>
  <g>
